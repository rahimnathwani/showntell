# showntell for a company, behind Caddy. Copy .env.example to .env, fill it in, then:
#   docker compose -f deploy/compose.yaml up -d --build
name: showntell

services:
  showntell:
    build:
      context: ..
      dockerfile: Dockerfile
    image: showntell:hosted
    restart: unless-stopped
    env_file: .env
    environment:
      SHOWNTELL_PUBLIC_URL: https://${SHOWNTELL_DOMAIN:?set SHOWNTELL_DOMAIN in deploy/.env}
    volumes:
      - showntell-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m  # Chromium's shared memory
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Chromium's sandbox makes user namespaces, which Docker's default seccomp profile blocks;
      # this profile is the default one plus those calls (docs/self-hosting.md, "Chromium").
      - seccomp=chromium-seccomp.json
    expose:
      - "4747"

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: [showntell]
    environment:
      SHOWNTELL_DOMAIN: ${SHOWNTELL_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  showntell-data:
  caddy-data:
  caddy-config:
