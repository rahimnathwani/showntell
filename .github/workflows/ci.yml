name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (fake speech, browser, ONNX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -m "not mlx and not onnx and not browser"
      - run: node --test tests/js/*.test.js
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -m browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-screenshots-linux
          path: tests/artifacts/
          if-no-files-found: ignore
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-onnx-${{ hashFiles('src/showntell/speech/onnx_backend.py') }}
      - name: Download the ONNX voice model and the spaCy English model
        run: uv run showntell doctor --speech onnx
      - run: uv run pytest -m onnx -rs

  macos:
    name: macOS Apple silicon (MLX)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not browser and not onnx and not mlx"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mlx-${{ hashFiles('src/showntell/speech/mlx_backend.py') }}
      - name: Download the MLX voice model and the spaCy English model
        run: uv run showntell doctor --speech mlx
      - run: uv run pytest -m mlx -rs

  action:
    name: The GitHub Action, on its own example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          markdown: action/example.md
          format: both
          name: action-example
          comment: "false"

  wheel:
    name: Built wheel, installed outside the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/sync_version.py --check
      - run: uv build
      # version, doctor and play with fake speech from a temp folder, then a clean daemon shutdown:
      # no process left and the lockfile removed
      - run: bash scripts/wheel_smoke.sh
