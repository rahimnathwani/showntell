<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>showntell</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
:root { color-scheme: dark; --bg: #0b0d12; --panel: #141922; --line: #232b38; --fg: #e9edf3; --muted: #8e98a9; --accent: #ffc857; }
@media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f6f4ef; --panel: #ffffff; --line: #e4e0d6; --fg: #1d2129; --muted: #69707d; --accent: #b7791f; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
header img { width: 30px; height: 30px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 28px; }
ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); align-items: center; }
.thumb { grid-column: 1; grid-row: 1 / span 3; width: 96px; height: 54px; object-fit: contain; border-radius: 6px; background: var(--panel); align-self: start; }
li a { grid-column: 2; }
li a { color: var(--fg); font-weight: 600; text-decoration: none; }
li a:hover, li a:focus-visible { color: var(--accent); }
.desc { grid-column: 2; font-size: 14px; }
.meta { grid-column: 2; color: var(--muted); font-size: 14px; }
.badge { justify-self: start; font-size: 12px; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-left: 8px; }
li a + .badge { grid-column: 2; }
.del { grid-column: 3; grid-row: 1 / span 3; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.del:hover, .del:focus-visible { color: #f87171; border-color: #f87171; }
.empty { display: block; color: var(--muted); }
footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; }
</style>
</head>
<body data-csrf="{{CSRF}}">
<main>
  <header><img src="/static/icon.svg" alt=""><h1>showntell</h1></header>
  <p class="lede">Narrated walkthroughs made by your coding agent, voiced on this machine.</p>
  <ul id="list">
{{ROWS}}
  </ul>
  <footer>showntell {{VERSION}} · Ask your agent for a walkthrough, or run <code>showntell play file.md</code>.</footer>
</main>
<script src="/static/gallery.js"></script>
</body>
</html>
